# 让 systemd user service(如 vicinae)启动的应用知道当前是 Wayland 会话。
#
# 同 10-electron-wayland.conf:systemd user manager 不继承 Hyprland 的环境,
# 缺了 XDG_SESSION_TYPE。Wails v3 应用(magpie)见它为空就强设 GDK_BACKEND=x11,
# 落到 XWayland;在 force_zero_scaling 下又拿不到 GDK_SCALE,以 1x 渲染。
# 补上之后走原生 Wayland,直接跟随显示器 scale。
XDG_SESSION_TYPE=wayland
