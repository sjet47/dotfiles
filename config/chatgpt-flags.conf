# ChatGPT Desktop 启动参数。
# /usr/bin/chatgpt(软链到 /usr/lib/chatgpt/codex-launcher,一个 sh wrapper)
# 会读取本文件并把 flag 插到启动参数最前面,覆盖所有启动路径(vicinae / 应用菜单 / 终端)。
#
# 不用 ELECTRON_OZONE_PLATFORM_HINT:这个环境变量在本机多数 Electron 应用上检测
# 失败会回退 XWayland,而 xwayland.force_zero_scaling=true + 显示器 1.5 scale 下
# 回退的表现就是"页面变小"。
--ozone-platform=wayland

# 本体是 Chrome 152,text-input-v3 已自动生效,不显式加 --enable-wayland-ime。
# 若 fcitx5 在窗口里打不出中文,再补:
# --enable-wayland-ime
# --wayland-text-input-version=3
