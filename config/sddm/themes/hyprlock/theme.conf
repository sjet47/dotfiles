[General]
# 背景图,安装脚本从 hyprlock 用的同两张图拷进来。横屏/竖屏各一张,
# Main.qml 按屏幕方向自动选,与 hyprlock 的分屏配置保持一致。
background=background.png
backgroundPortrait=background-portrait.png

# 可选微调倍数(1.0 = 与 hyprlock 视觉一致)。真正的缩放由 Main.qml 按屏幕高度自算。

scale=1.0

# 调色板 —— 与 hyprlock.conf / waybar style.css 同源
colorForeground=#f5f5f7
colorMuted=#98989d
colorSurface=#1c1c1e
colorSuccess=#34c759
colorFailure=#ff453a
