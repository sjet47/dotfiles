general {
    lock_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 900
    # 单参数作用于全部显示器;本版本带显示器名的两参数写法是空操作,不会真正熄屏。
    # 唤醒交给 misc.mouse_move/key_press_enables_dpms(input/looknfeel 模块),无需 on-resume。
    # 注:外接 DP 唤醒冻结靠内核参数 amdgpu.dcdebugmask=0x410(关 Panel Replay)根治,见 rEFInd cmdline。
    #
    # DP-2(type-c 便携屏)例外:它 DPMS off 后 5~7s 必掉线、1s 后重连,Hyprland 把重连当新
    # 显示器点亮,于是别的屏都黑了只有它亮着。重连后再按灭也没用 —— 实测按一次循环一次。
    # 所以对它不走 dpms 而是直接禁用(禁用后只重连一次就稳定黑着),恢复时再启用。
    # hl.monitor 是在现有规则上叠字段,只写 disabled 即可,位置/缩放仍取 local/init.lua 的。
    # 先禁用再 dpms off:反过来的话禁用触发的显示器状态刷新会落在已熄屏的其他屏上。
    # 万一 on-resume 没跑到(hypridle 中途挂了),`hyprctl reload` 可把 DP-2 拉回来。
    on-timeout = hyprctl eval 'hl.monitor({ output = "DP-2", disabled = true })'; hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.monitor({ output = "DP-2", disabled = false })'
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}
