# 换成挂了 zhwiki 的词典;用户词库名不变,仍是 rime_ice。
# quickphrase:`;` 前缀输入 LaTeX 符号和 emoji,见 lua/quickphrase.lua。
patch:
  translator/dictionary: rime_ice_ext
  translator/user_dict: rime_ice
  recognizer/patterns/quickphrase: "^;[\\\\:_A-Za-z]*$"
  engine/translators/+:
    - lua_translator@*quickphrase
  # 置顶候选:不受用户词频影响。Shift+Del 只是软删,再选一次就带着原词频复活,
  # 想固定首选要靠这里。格式 编码<Tab>字词1 字词2,见 lua/pin_cand_filter.lua 说明书。
  pin_cand_filter/+:
    - "l\t了"
